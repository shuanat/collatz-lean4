name: Lean 4 CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Lean toolchain
        run: |
          elan toolchain install $(cat lean-toolchain)
          elan default $(cat lean-toolchain)

      - name: Cache Lake dependencies
        uses: actions/cache@v4
        with:
          path: .lake
          key: ${{ runner.os }}-lake-${{ hashFiles('lakefile.lean', 'lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Build production entry
        run: |
          lake exe cache get || true
          lake build Collatz

      - name: Build sanity / regression / axiom-check targets
        run: |
          lake build Collatz.Tests.ResidualSanity Collatz.Tests.VacuityRegression Collatz.Tests.AxiomCheck

      - name: No sorry / axiom / native_decide gate
        run: |
          set -euo pipefail
          # grep (not rg: ripgrep is not installed on ubuntu-latest; the old step
          # silently counted 0 because the missing command was masked by `|| true`).
          count() { { grep -rnE --include='*.lean' "$1" Collatz || true; } | wc -l; }
          # Self-test: the gate must detect a planted violation, otherwise fail loudly.
          printf 'theorem t : True := by sorry\n' | grep -qE '\bsorry\b'

          SORRY_COUNT=$(count '\bsorry\b|\badmit\b')
          AXIOM_COUNT=$(count '^[[:space:]]*axiom\b')
          NATIVE_COUNT=$(count 'native_decide|implemented_by|@\[extern')

          echo "chain_sorry_count=$SORRY_COUNT" >> $GITHUB_ENV
          echo "chain_axiom_count=$AXIOM_COUNT" >> $GITHUB_ENV

          if [ "$SORRY_COUNT" -ne 0 ] || [ "$AXIOM_COUNT" -ne 0 ] || [ "$NATIVE_COUNT" -ne 0 ]; then
            echo "Gate failed: found sorry/admit, axiom, or native_decide/implemented_by/extern under Collatz/."
            grep -rnE --include='*.lean' '\bsorry\b|\badmit\b|^[[:space:]]*axiom\b|native_decide|implemented_by|@\[extern' Collatz || true
            exit 1
          fi

      - name: Paper-label mapping gate
        run: |
          # The mapping file must still mention every paper result it tracks.
          # (The paper lives in a separate private repository that is not checked out
          # here; its anchors are checked locally by the workspace lint hook.)
          grep -Eq "D\.1|E\.2|F\.6|F\.7|G\.5|H\.main|I\.1" Collatz/Documentation/PaperCodeMapping.lean

      - name: Generate CI summary
        if: always()
        run: |
          echo "### Lean 4 Proof Closure Summary" >> $GITHUB_STEP_SUMMARY
          echo "- chain sorry count: ${chain_sorry_count:-n/a}" >> $GITHUB_STEP_SUMMARY
          echo "- chain axiom count: ${chain_axiom_count:-n/a}" >> $GITHUB_STEP_SUMMARY
